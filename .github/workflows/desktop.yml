# Desktop builds and releases: macOS arm64, Windows x64 and Windows arm64. See RELEASE-SETUP.md.
#
#  push to main → nightlies: macOS Developer ID signed + notarized when the `release-build`
#                 environment (which admits main) holds all five signing secrets, else ad-hoc signed
#                 (the explicit no-secrets fallback, e.g. forks: a warning, not a failure); Windows
#                 unsigned; each smoke-tested (Windows arm64 on a native arm64 runner) and uploaded
#                 as a 14-day run artifact. NEVER a release.
#  push tag v*  → release builds (`release-build` environment, no reviewer; these jobs run on v* tags only): tag must
#                 be vX.Y.Z on origin/main; macOS Developer ID signed + notarized; Windows unsigned
#                 until Azure Trusted Signing is configured; every platform smoke-tested against old
#                 databases (any failure = no draft).
#               → draft-release: merges the platforms' partial manifests into apollo-update.json and
#                 creates a DRAFT GitHub Release with every installer, the manifest and SHA256SUMS.
#               → sign-and-publish (`release` environment, Luc = required reviewer: THE human gate):
#                 re-verifies the draft, signs apollo-update.json with minisign, attests provenance,
#                 publishes the release as a PRERELEASE (release candidate; never "latest").
#               → promote-to-stable.yml (manual) makes it the stable "latest" release, no rebuild.
#  manual       → same as a main push (dispatch it on main).
name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-stamp:
    name: Nightly version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One stamp for every platform of this run (the UTC date must not differ between builds).
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      channel: ${{ steps.stamp.outputs.channel }}
      bundle_version: ${{ steps.stamp.outputs.bundle_version }}
      commit: ${{ steps.stamp.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: stamp
        run: node apps/desktop/scripts/release/stamp.ts

  nightly:
    name: Nightly macOS arm64 (Developer ID when configured, else ad-hoc; artifact only)
    needs: nightly-stamp
    runs-on: macos-15
    timeout-minutes: 120 # notarizing the app and the dmg adds minutes
    # Signing secrets when configured; the environment's deployment policy admits main (this job
    # only runs on main, via nightly-stamp). Without them (forks, not set up yet) → ad-hoc.
    environment: release-build
    steps:
      - name: Signing mode (Developer ID when all five secrets are set, else ad-hoc)
        id: signing
        env:
          RELEASE_DEVELOPER_ID_P12: ${{ secrets.RELEASE_DEVELOPER_ID_P12 }}
          RELEASE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.RELEASE_DEVELOPER_ID_P12_PASSWORD }}
          RELEASE_ASC_KEY_ID: ${{ secrets.RELEASE_ASC_KEY_ID }}
          RELEASE_ASC_ISSUER_ID: ${{ secrets.RELEASE_ASC_ISSUER_ID }}
          RELEASE_ASC_KEY_P8: ${{ secrets.RELEASE_ASC_KEY_P8 }}
        run: |
          missing=()
          for name in RELEASE_DEVELOPER_ID_P12 RELEASE_DEVELOPER_ID_P12_PASSWORD RELEASE_ASC_KEY_ID RELEASE_ASC_ISSUER_ID RELEASE_ASC_KEY_P8; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned nightly::Nightly builds are ad-hoc signed and not releasable: missing in the 'release-build' environment: ${missing[*]}. See RELEASE-SETUP.md."
          else
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "All signing secrets are present: Developer ID signed + notarized nightly."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags + history: version and CFBundleVersion come from them
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          native: "true"
      - name: Write the App Store Connect key for notarytool
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          RELEASE_ASC_KEY_P8: ${{ secrets.RELEASE_ASC_KEY_P8 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          # Accept the .p8 as pasted (PEM) or base64 of the file.
          if [[ "$RELEASE_ASC_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$RELEASE_ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          else
            printf '%s' "$RELEASE_ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          fi
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc/AuthKey.p8" || { echo "::error::RELEASE_ASC_KEY_P8 is not a .p8 private key (PEM or base64 of it)"; exit 1; }
      - name: Build (Developer ID signed + notarized when configured, else ad-hoc and NOT releasable)
        env:
          APOLLO_BUILD_VERSION: ${{ needs.nightly-stamp.outputs.version }}
          APOLLO_BUILD_CHANNEL: ${{ needs.nightly-stamp.outputs.channel }}
          APOLLO_BUILD_NUMBER: ${{ needs.nightly-stamp.outputs.bundle_version }}
          APOLLO_BUILD_COMMIT: ${{ needs.nightly-stamp.outputs.commit }}
          APOLLO_CODESIGN: ${{ steps.signing.outputs.mode }}
          # Everything below is empty in ad-hoc mode (build-release.ts drops an empty CSC_LINK).
          APOLLO_TEAM_ID: ${{ steps.signing.outputs.mode == 'developer-id' && (vars.APOLLO_TEAM_ID || 'XA3R5NAN2C') || '' }}
          # electron-builder imports the base64 .p12 into a temporary keychain it deletes afterwards.
          CSC_LINK: ${{ steps.signing.outputs.mode == 'developer-id' && secrets.RELEASE_DEVELOPER_ID_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ steps.signing.outputs.mode == 'developer-id' && secrets.RELEASE_DEVELOPER_ID_P12_PASSWORD || '' }}
          APPLE_API_KEY: ${{ steps.signing.outputs.mode == 'developer-id' && format('{0}/asc/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ steps.signing.outputs.mode == 'developer-id' && secrets.RELEASE_ASC_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.signing.outputs.mode == 'developer-id' && secrets.RELEASE_ASC_ISSUER_ID || '' }}
        run: node apps/desktop/scripts/release/build-release.ts --out "$RUNNER_TEMP/dist"
      - name: Remove the App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
      - name: Smoke test (packaged app against old databases)
        run: node apps/desktop/scripts/release/smoke.ts --zip "$RUNNER_TEMP"/dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apollo-desktop-${{ needs.nightly-stamp.outputs.version }}-darwin-arm64
          path: ${{ runner.temp }}/dist
          retention-days: 14
          if-no-files-found: error
      - name: Summary
        env:
          VERSION: ${{ needs.nightly-stamp.outputs.version }}
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          {
            if [[ "$MODE" == "developer-id" ]]; then
              echo "### Nightly ${VERSION} (Developer ID signed + notarized)"
            else
              echo "### Nightly ${VERSION} (ad-hoc signed — not releasable)"
            fi
            echo '```'
            cat "$RUNNER_TEMP/dist/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  nightly-windows:
    name: Nightly Windows ${{ matrix.arch }} (unsigned, artifact only)
    needs: nightly-stamp
    # Both architectures build on x64: build.ps1 cross-builds the tailnet addon with llvm-mingw,
    # and electron-builder packages win32-arm64 Electron from any host.
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust-target: x86_64-pc-windows-gnullvm
          - arch: arm64
            rust-target: aarch64-pc-windows-gnullvm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          native: "true"
          rust-targets: ${{ matrix.rust-target }}
      - uses: ./.github/actions/llvm-mingw
      - name: Build (unsigned)
        env:
          APOLLO_BUILD_VERSION: ${{ needs.nightly-stamp.outputs.version }}
          APOLLO_BUILD_CHANNEL: ${{ needs.nightly-stamp.outputs.channel }}
          APOLLO_BUILD_NUMBER: ${{ needs.nightly-stamp.outputs.bundle_version }}
          APOLLO_BUILD_COMMIT: ${{ needs.nightly-stamp.outputs.commit }}
          ARCH: ${{ matrix.arch }}
        run: node apps/desktop/scripts/release/build-release-win.ts --arch "$ARCH" --out "$RUNNER_TEMP/dist"
      - name: Smoke test (x64; arm64 runs on an arm64 runner below)
        if: matrix.arch == 'x64'
        env:
          APOLLO_BUILD_VERSION: ${{ needs.nightly-stamp.outputs.version }}
          APOLLO_BUILD_COMMIT: ${{ needs.nightly-stamp.outputs.commit }}
        run: node apps/desktop/scripts/release/smoke.ts --nsis "$RUNNER_TEMP"/dist/*-setup.exe --app-arg --disable-gpu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apollo-desktop-${{ needs.nightly-stamp.outputs.version }}-win32-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist
          retention-days: 14
          if-no-files-found: error

  nightly-windows-arm64-smoke:
    name: Nightly Windows arm64 smoke test
    needs: [nightly-stamp, nightly-windows]
    runs-on: windows-11-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apollo-desktop-${{ needs.nightly-stamp.outputs.version }}-win32-arm64
          path: ${{ runner.temp }}/dist
      - name: Smoke test (packaged arm64 app against old databases)
        env:
          APOLLO_BUILD_VERSION: ${{ needs.nightly-stamp.outputs.version }}
        run: node apps/desktop/scripts/release/smoke.ts --nsis "$RUNNER_TEMP"/dist/*-setup.exe --app-arg --disable-gpu

  release-build:
    name: Release macOS arm64 (Developer ID, notarized)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 150
    # Developer ID + App Store Connect secrets. No reviewer (the approval gate is on signing the
    # manifest below); the environment's deployment policy admits v* tags and main (main: nightlies
    # and manual iOS runs); this job itself runs on v* tags only.
    environment: release-build
    outputs:
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - name: Check release secrets
        env:
          RELEASE_DEVELOPER_ID_P12: ${{ secrets.RELEASE_DEVELOPER_ID_P12 }}
          RELEASE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.RELEASE_DEVELOPER_ID_P12_PASSWORD }}
          RELEASE_ASC_KEY_ID: ${{ secrets.RELEASE_ASC_KEY_ID }}
          RELEASE_ASC_ISSUER_ID: ${{ secrets.RELEASE_ASC_ISSUER_ID }}
          RELEASE_ASC_KEY_P8: ${{ secrets.RELEASE_ASC_KEY_P8 }}
        run: |
          missing=()
          for name in RELEASE_DEVELOPER_ID_P12 RELEASE_DEVELOPER_ID_P12_PASSWORD RELEASE_ASC_KEY_ID RELEASE_ASC_ISSUER_ID RELEASE_ASC_KEY_P8; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error title=Release secrets missing::Missing in the 'release-build' environment: ${missing[*]}. A release build must be Developer ID signed and notarized; nothing was built. See RELEASE-SETUP.md."
            { echo "### Release build not started"; echo "Missing secrets in the \`release-build\` environment: \`${missing[*]}\`"; echo "See RELEASE-SETUP.md."; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All release secrets are present."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          native: "true"
      - name: Typecheck and test
        run: pnpm typecheck && pnpm test
      - name: Stamp version (refuses malformed tags and tags not on origin/main)
        id: stamp
        run: node apps/desktop/scripts/release/stamp.ts
      - name: Write the App Store Connect key for notarytool
        env:
          RELEASE_ASC_KEY_P8: ${{ secrets.RELEASE_ASC_KEY_P8 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          # Accept the .p8 as pasted (PEM) or base64 of the file.
          if [[ "$RELEASE_ASC_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$RELEASE_ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          else
            printf '%s' "$RELEASE_ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          fi
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc/AuthKey.p8" || { echo "::error::RELEASE_ASC_KEY_P8 is not a .p8 private key (PEM or base64 of it)"; exit 1; }
      - name: Build, sign (Developer ID) and notarize
        env:
          APOLLO_BUILD_VERSION: ${{ steps.stamp.outputs.version }}
          APOLLO_BUILD_CHANNEL: ${{ steps.stamp.outputs.channel }}
          APOLLO_BUILD_NUMBER: ${{ steps.stamp.outputs.bundle_version }}
          APOLLO_BUILD_COMMIT: ${{ steps.stamp.outputs.commit }}
          APOLLO_CODESIGN: developer-id
          APOLLO_TEAM_ID: ${{ vars.APOLLO_TEAM_ID || 'XA3R5NAN2C' }}
          # electron-builder imports the base64 .p12 into a temporary keychain it deletes afterwards.
          CSC_LINK: ${{ secrets.RELEASE_DEVELOPER_ID_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.RELEASE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/asc/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.RELEASE_ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.RELEASE_ASC_ISSUER_ID }}
        run: node apps/desktop/scripts/release/build-release.ts --out "$RUNNER_TEMP/dist"
      - name: Remove the App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
      - name: Smoke test (gate for the draft release)
        run: node apps/desktop/scripts/release/smoke.ts --zip "$RUNNER_TEMP"/dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apollo-desktop-release-${{ github.ref_name }}-darwin-arm64
          path: ${{ runner.temp }}/dist
          retention-days: 30
          if-no-files-found: error

  release-build-windows:
    name: Release Windows ${{ matrix.arch }} (unsigned until Azure Trusted Signing)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust-target: x86_64-pc-windows-gnullvm
          - arch: arm64
            rust-target: aarch64-pc-windows-gnullvm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          native: "true"
          rust-targets: ${{ matrix.rust-target }}
      - uses: ./.github/actions/llvm-mingw
      - name: Stamp version (refuses malformed tags and tags not on origin/main)
        id: stamp
        run: node apps/desktop/scripts/release/stamp.ts
      - name: Build (Authenticode via Azure Trusted Signing when configured, else unsigned)
        env:
          APOLLO_BUILD_VERSION: ${{ steps.stamp.outputs.version }}
          APOLLO_BUILD_CHANNEL: ${{ steps.stamp.outputs.channel }}
          APOLLO_BUILD_NUMBER: ${{ steps.stamp.outputs.bundle_version }}
          APOLLO_BUILD_COMMIT: ${{ steps.stamp.outputs.commit }}
          ARCH: ${{ matrix.arch }}
          # Placeholders: all empty today, so the build is unsigned. Set all seven to sign (RELEASE-SETUP.md).
          AZURE_TENANT_ID: ${{ secrets.RELEASE_AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.RELEASE_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.RELEASE_AZURE_CLIENT_SECRET }}
          APOLLO_AZURE_SIGN_ENDPOINT: ${{ vars.APOLLO_AZURE_SIGN_ENDPOINT }}
          APOLLO_AZURE_SIGN_ACCOUNT: ${{ vars.APOLLO_AZURE_SIGN_ACCOUNT }}
          APOLLO_AZURE_SIGN_PROFILE: ${{ vars.APOLLO_AZURE_SIGN_PROFILE }}
          APOLLO_AZURE_SIGN_PUBLISHER: ${{ vars.APOLLO_AZURE_SIGN_PUBLISHER }}
        run: |
          [[ -n "$AZURE_CLIENT_SECRET" ]] || echo "::warning title=Unsigned Windows build::Azure Trusted Signing is not configured: the ${ARCH} installer is unsigned (SmartScreen warns). See RELEASE-SETUP.md."
          node apps/desktop/scripts/release/build-release-win.ts --arch "$ARCH" --out "$RUNNER_TEMP/dist"
      - name: Smoke test (gate for the draft release; arm64 runs on an arm64 runner below)
        if: matrix.arch == 'x64'
        env:
          APOLLO_BUILD_VERSION: ${{ steps.stamp.outputs.version }}
          APOLLO_BUILD_COMMIT: ${{ steps.stamp.outputs.commit }}
        run: node apps/desktop/scripts/release/smoke.ts --nsis "$RUNNER_TEMP"/dist/*-setup.exe --app-arg --disable-gpu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apollo-desktop-release-${{ github.ref_name }}-win32-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist
          retention-days: 30
          if-no-files-found: error

  release-smoke-windows-arm64:
    name: Release Windows arm64 smoke test (gate)
    needs: release-build-windows
    runs-on: windows-11-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apollo-desktop-release-${{ github.ref_name }}-win32-arm64
          path: ${{ runner.temp }}/dist
      - name: Smoke test (packaged arm64 app against old databases)
        env:
          APOLLO_BUILD_COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: APOLLO_BUILD_VERSION="${TAG#v}" node apps/desktop/scripts/release/smoke.ts --nsis "$RUNNER_TEMP"/dist/*-setup.exe --app-arg --disable-gpu

  draft-release:
    name: Draft GitHub Release
    needs: [release-build, release-build-windows, release-smoke-windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # only this job can write, and only to create the draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apollo-desktop-release-${{ github.ref_name }}-*
          path: parts # one subdirectory per platform build
      - name: Merge the platforms (re-hash every file; exactly darwin-arm64, win32-x64, win32-arm64)
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.release-build.outputs.version }}
        run: |
          [[ "v${VERSION}" == "${TAG}" ]] || { echo "::error::stamped ${VERSION} != tag ${TAG}"; exit 1; }
          node apps/desktop/scripts/release/merge-manifests.ts --out dist --version "$VERSION" --commit "$GITHUB_SHA" parts/*
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.release-build.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A release for ${TAG} already exists. Releases are never re-uploaded: delete the draft by hand or tag a new version."
            exit 1
          fi
          {
            echo "Apollo ${VERSION} for macOS (Apple silicon) and Windows (x64, arm64), built from ${GITHUB_SHA} by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo
            echo "macOS: Developer ID signed and notarized. Windows: $(jq -r '[.assets[] | select(.platform == "win32") | "\(.arch) \(.codeSigning.kind)"] | join(", ")' dist/apollo-update.json) (unsigned installers make SmartScreen warn on first run)."
            echo "Every platform was smoke-tested against old databases before this draft was created."
            echo
            echo "**Draft:** published as a release candidate once Luc approves the signing job; promote-to-stable makes it the stable release."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Apollo ${VERSION}" --notes-file notes.md dist/*
          echo "Draft release ${TAG} created." >> "$GITHUB_STEP_SUMMARY"

  sign-and-publish:
    name: Sign the manifest and publish (approval)
    needs: [release-build, draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # THE human gate: Luc approves this job. RELEASE_MINISIGN_SECRET exists only here.
    environment: release
    permissions:
      contents: write     # upload the signature, publish the draft
      id-token: write     # build provenance attestation (Sigstore)
      attestations: write
    steps:
      - name: Check signing configuration
        env:
          RELEASE_MINISIGN_SECRET: ${{ secrets.RELEASE_MINISIGN_SECRET }}
          RELEASE_MINISIGN_PUBLIC_KEY: ${{ vars.RELEASE_MINISIGN_PUBLIC_KEY }}
        run: |
          missing=()
          [[ -n "$RELEASE_MINISIGN_SECRET" ]] || missing+=("secret RELEASE_MINISIGN_SECRET")
          [[ -n "$RELEASE_MINISIGN_PUBLIC_KEY" ]] || missing+=("variable RELEASE_MINISIGN_PUBLIC_KEY")
          if (( ${#missing[@]} )); then
            echo "::error title=Signing not configured::Missing in the 'release' environment: ${missing[*]}. The draft stays a draft. See RELEASE-SETUP.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag and origin/main, to re-check where the tag points
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign && minisign -v
      - name: Re-verify the draft (tag on main, manifest, hashes, Developer ID, unsigned)
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MINISIGN_PUBLIC_KEY: ${{ vars.RELEASE_MINISIGN_PUBLIC_KEY }}
        run: node apps/desktop/scripts/release/verify-release.ts --tag "$GITHUB_REF_NAME" --stage sign --dir "$RUNNER_TEMP/release"
      - name: Sign apollo-update.json (minisign)
        env:
          RELEASE_MINISIGN_SECRET: ${{ secrets.RELEASE_MINISIGN_SECRET }}
          RELEASE_MINISIGN_PASSWORD: ${{ secrets.RELEASE_MINISIGN_PASSWORD }}
          RELEASE_MINISIGN_PUBLIC_KEY: ${{ vars.RELEASE_MINISIGN_PUBLIC_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/minisign/apollo.key"
          mkdir -p "$(dirname "$key")"
          trap 'rm -rf "$RUNNER_TEMP/minisign"' EXIT
          printf '%s\n' "$RELEASE_MINISIGN_SECRET" > "$key"
          dir="$RUNNER_TEMP/release"
          # minisign reads the key password from stdin (empty line for a key made with -W).
          printf '%s\n' "$RELEASE_MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$dir/apollo-update.json" \
            -t "$(cat "$dir/.trusted-comment")" -x "$dir/apollo-update.json.minisig" > /dev/null
          # The public key configured for the app must verify what was just signed.
          minisign -V -P "$RELEASE_MINISIGN_PUBLIC_KEY" -m "$dir/apollo-update.json" -x "$dir/apollo-update.json.minisig"
      - name: Attest build provenance (audit only; the app trusts minisign)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.dmg
            ${{ runner.temp }}/release/*.exe
            ${{ runner.temp }}/release/apollo-update.json
      - name: Upload the signature and publish as a release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/release/apollo-update.json.minisig"
          # Prerelease: never "latest", so no updater is offered it until promote-to-stable.
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          echo "### Apollo ${VERSION} published as a release candidate (signed). Run promote-to-stable to make it the stable release." >> "$GITHUB_STEP_SUMMARY"
