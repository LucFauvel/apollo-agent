# Toolchains + `pnpm install --frozen-lockfile`. Local composite action (no pin needed); the
# third-party actions it uses are pinned by commit SHA.
name: Set up Apollo toolchains
description: Node (.node-version), pnpm (package.json packageManager), optionally Go + Rust for the native addons.
inputs:
  native:
    description: "Also set up Go (tailnet go.mod version) and Rust (with rust-targets)."
    default: "false"
  rust-targets:
    description: "Space-separated Rust targets to add when native is true."
    default: "aarch64-apple-darwin"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
    # Node 25+ no longer ships corepack: install the exact pnpm from package.json's packageManager.
    - name: pnpm
      shell: bash
      run: |
        version="$(node -p 'require("./package.json").packageManager.split("@")[1]')"
        npm install --global --no-fund --no-audit "pnpm@${version}"
        pnpm --version
    - if: inputs.native == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: apps/server/native/tailnet/go.mod
        cache-dependency-path: |
          apps/server/native/tailnet/go.sum
          apps/mobile/modules/apollo-tailnet/go/go.sum
    - if: inputs.native == 'true'
      name: Rust
      shell: bash
      env:
        RUST_TARGETS: ${{ inputs.rust-targets }}
      run: |
        command -v rustup >/dev/null || { echo "::error::rustup is not on this runner image"; exit 1; }
        # shellcheck disable=SC2086 # a space-separated list on purpose
        rustup target add $RUST_TARGETS
        cargo --version
    - name: pnpm install
      shell: bash
      run: pnpm install --frozen-lockfile
