# Installers for the desktop app: `pnpm package` (or `pnpm package:dir` for an
# unpacked build to test quickly). Output goes to apps/desktop/release/.
appId: dev.apollo.desktop
productName: Apollo
executableName: apollo
directories:
  output: release
  # icon.icns / icon.ico / icon.png, rendered from resources/icons/*.svg by `pnpm icons`.
  buildResources: resources
files:
  - dist-electron/**/*
  - package.json
# Kept outside the asar archive: the server runs as a separate Node process.
extraResources:
  - from: build/server
    to: server
  - from: build/web
    to: web
  - from: resources/tray
    to: tray
  # Commit and schema version of this build (scripts/write-build-info.ts).
  - from: build/build-info.json
    to: build-info.json
  # Apollo's own Tailscale node, a Node-API addon (apps/server/native/tailnet/build.sh).
  - from: ../server/native/tailnet/build
    to: native
    filter: ["apollo_tailnet.node"]
# No npm native modules: the server is a single bundle, node:sqlite is built in, and the
# tailnet addon above is built from Go by its own script.
npmRebuild: false
linux:
  target: [AppImage]
  category: Development
mac:
  target: [dmg]
  category: public.app-category.developer-tools
  extendInfo:
    # Dictation and voice conversations (speech is transcribed locally).
    NSMicrophoneUsageDescription: Apollo listens when you dictate or talk with a bot. Speech is transcribed on this Mac.
win:
  target: [nsis]
# Per-user, one click: installs to %LOCALAPPDATA%\Programs\Apollo without an admin prompt.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
