# Installers for the desktop app: `pnpm package` (or `pnpm package:dir` for an
# unpacked build to test quickly). Output goes to apps/desktop/release/.
appId: dev.apollo.desktop
productName: Apollo
executableName: apollo
directories:
  output: release
  # icon.icns / icon.ico / icon.png, rendered from resources/icons/*.svg by `pnpm icons`.
  buildResources: resources
files:
  - dist-electron/**/*
  - package.json
# Kept outside the asar archive: the server runs as a separate Node process.
extraResources:
  - from: build/server
    to: server
  - from: build/web
    to: web
  - from: resources/tray
    to: tray
# No native modules: the server is a single bundle and node:sqlite is built in.
npmRebuild: false
linux:
  target: [AppImage]
  category: Development
mac:
  target: [dmg]
  category: public.app-category.developer-tools
  extendInfo:
    # Dictation and voice conversations (speech is transcribed locally).
    NSMicrophoneUsageDescription: Apollo listens when you dictate or talk with a bot. Speech is transcribed on this Mac.
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
